<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--OFFICE:INNER-START-->
<title>Agent Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--OFFICE:PWA-START-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<!--OFFICE:PWA-END-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: department-store floor guide | isometric office (canvas + HTML bubbles) | site log rail.
   Cool paper, ink type, one signal green for LIVE. The office itself is drawn in code: no image assets. */
:root{
  --paper:#F3F5F7; --panel:#FFFFFF; --ink:#1B2430; --muted:#606E7C; --line:#D6DDE4; --line-strong:#AEB9C4;
  --accent:#0B6E7F; --accent-ink:#FFFFFF; --live:#16A35C; --warn:#C7791A; --bad:#C8463B;
  --bubble:#FFFFFF; --bubble-ink:#1B2430; --shadow:0 1px 2px rgba(20,30,40,.08),0 6px 18px rgba(20,30,40,.10);
  --stage:#E9EDF1;
  --c-claude:#DD6F2E; --c-user:#2F4F9E; --c-explore:#2E9D5B; --c-plan:#7B4FB5; --c-general:#3B6EC9; --c-guide:#B38B1D; --c-other:#6B7580;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F151C; --panel:#161E27; --ink:#E6EBF0; --muted:#96A4B2; --line:#283340; --line-strong:#3C4A59;
  --accent:#4FB3C4; --accent-ink:#0B1218; --live:#3BCB7E; --warn:#E39A3B; --bad:#E86A5E;
  --bubble:#1F2933; --bubble-ink:#E6EBF0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  --stage:#121A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F151C; --panel:#161E27; --ink:#E6EBF0; --muted:#96A4B2; --line:#283340; --line-strong:#3C4A59;
  --accent:#4FB3C4; --accent-ink:#0B1218; --live:#3BCB7E; --warn:#E39A3B; --bad:#E86A5E;
  --bubble:#1F2933; --bubble-ink:#E6EBF0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  --stage:#121A22; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,select,label{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;gap:12px;min-height:100%}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)} .rail{grid-column:1/-1}}
.tabs{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:10px} .guide,.rail{grid-column:auto;display:contents}
  .main{order:-2} .tabs{order:-1;display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--accent);color:var(--accent-ink)}
  .guide .card,.rail .card{display:none}
  .app[data-tab="progress"] .card[data-tab="progress"],.app[data-tab="people"] .card[data-tab="people"],.app[data-tab="log"] .card[data-tab="log"],.app[data-tab="floors"] .card[data-tab="floors"]{display:block}
  .topbar .title{font-size:14px} .controls{margin-left:0;width:100%}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 12px 6px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 .n{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none}
.sec{padding:0 12px 10px}

/* ---- floor guide (department-store directory) ---- */
.guide{display:flex;flex-direction:column;gap:10px;min-width:0}
.floors{list-style:none;margin:0;padding:4px 8px 8px;display:flex;flex-direction:column;gap:4px}
.floor{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 8px;border-radius:10px;cursor:pointer;border:1.5px solid transparent}
.floor:hover{background:var(--paper)}
.floor.sel{border-color:var(--accent);background:var(--paper)}
.floor .no{font-family:var(--mono);font-size:13px;font-weight:500;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center}
.floor.sel .no{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.floor .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floor .sb{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.lamp{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.lamp.on{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 25%,transparent)}
.lamp.off{background:var(--line)}
.follow{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.follow input{accent-color:var(--accent)}
.sessions{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.ses{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;align-items:center}
.ses:hover{background:var(--paper)} .ses.sel{background:var(--paper);outline:1.5px solid var(--accent)}
.ses .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ses .t small{font-family:var(--mono);color:var(--muted);font-size:10px;margin-left:4px}
.ses .w{font-size:11px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel)}
.pill.active{color:var(--live);border-color:color-mix(in srgb,var(--live) 50%,transparent)}
.pill.active .lamp{animation:pulse 1.6s infinite}
.pill.idle{color:var(--warn)} .pill.ended{color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--live) 30%,transparent)}50%{box-shadow:0 0 0 6px transparent}}

/* ---- stage ---- */
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px}
.topbar .title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.topbar .title .no{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 6px}
.topbar .sub{color:var(--muted);font-family:var(--mono);font-size:11px}
.controls{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.auth{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.auth img{width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.auth a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.floor.locked{opacity:.55;cursor:default} .floor.locked .no{background:var(--paper);color:var(--muted)}
.signin{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:500}
.btn:hover{border-color:var(--line-strong)} .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.floor:focus-visible,.ses:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.btn{padding:4px 6px}
.scrub{display:flex;align-items:center;gap:8px;padding:0 12px 8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.scrub input{flex:1;min-width:0;accent-color:var(--accent)}
.stage{position:relative;margin:0 12px 12px;height:620px;max-height:72vh;overscroll-behavior:contain;border-radius:10px;overflow:hidden;background:var(--stage);border:1px solid var(--line);touch-action:none}
@media (max-width:760px){.stage{height:58vh;min-height:360px;margin:0 8px 8px}}
.stage canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.bubble{position:absolute;transform:translate(-50%,-100%);width:max-content;min-width:40px;max-width:min(230px,46vw);background:var(--bubble);color:var(--bubble-ink);
  border:1px solid var(--line-strong);border-radius:10px;padding:5px 8px;font-size:11px;line-height:1.35;box-shadow:var(--shadow);white-space:normal;word-break:break-word}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:var(--bubble);border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
.bubble.think{border-style:dashed;border-radius:16px;color:var(--muted)} .bubble.think::after{border-style:dashed;border-radius:0 0 3px 0}
.bubble.tool{font-family:var(--mono);font-size:10.5px}
.bubble.err{border-color:var(--bad);color:var(--bad)}
.bubble.user{border-color:color-mix(in srgb,var(--c-user) 60%,var(--line-strong))}
.bubble .el{color:var(--muted);font-family:var(--mono);font-size:10px;margin-left:4px}
.tag{position:absolute;transform:translate(-50%,0);font-size:10px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap;color:var(--ink)}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.elev-ind{position:absolute;transform:translate(-50%,-100%);font-family:var(--mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:6px;opacity:0;transition:opacity .4s}
.elev-ind.show{opacity:1}
.roomlabel{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:6px;padding:1px 6px;letter-spacing:.02em}
.roomlabel small{font-family:var(--mono);color:var(--muted);font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-left:4px}
.empty{padding:20px 12px;color:var(--muted);font-size:12px}

/* ---- rail ---- */
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;font-size:12px;padding:4px 12px 10px}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 12px 10px}
.kpi div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .k{font-size:9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.people{display:flex;flex-direction:column;gap:10px}
.person{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.person .av{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.person .l1{display:flex;align-items:center;gap:6px;min-width:0}
.person .nm{font-weight:600;font-size:12px;white-space:nowrap} .person .sub{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;font-size:10px;font-weight:600;border-radius:999px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.work{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)} .badge.think{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)} .badge.err{color:var(--bad);border-color:var(--bad)}
.person .l2{font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.person .l3{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.task{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.task .st{flex:none;margin-top:2px;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:9px}
.task.completed .st{background:var(--live);border-color:var(--live);color:#fff}
.task.in_progress .st{border-color:var(--accent);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.task.completed .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.task .tid{font-family:var(--mono);color:var(--muted);font-size:10px;flex:none;margin-top:1px}
.files{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.files span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:360px;overflow:auto;font-size:11px}
.log li{display:grid;grid-template-columns:62px 16px minmax(0,1fr);gap:6px;align-items:start}
.log .lt{font-family:var(--mono);color:var(--muted);font-size:10px;margin-top:1px;white-space:nowrap}
.log .la{width:14px;height:14px;border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:600}
.log .lc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .lc.say{white-space:normal}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:0 12px 12px;font-size:11px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--line-strong);border-radius:2px;vertical-align:-1px;margin-right:5px}
.note{font-size:11px;color:var(--muted);padding:0 12px 10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.pill.active .lamp{animation:none}}
</style>
<!--OFFICE:HEAD-END-->
</head>
<body>
<!--OFFICE:BODY-START-->
<div class="app" id="app" data-tab="progress">
  <nav class="tabs" aria-label="패널">
    <button type="button" class="on" data-t="progress">진행도</button><button type="button" data-t="people">사람</button><button type="button" data-t="log">로그</button><button type="button" data-t="floors">층</button>
  </nav>
  <aside class="guide">
    <section class="card" data-tab="floors">
      <h2>층별 안내 <span class="n">FLOOR GUIDE</span></h2>
      <ul class="floors" id="floors"></ul>
      <label class="follow"><input type="checkbox" id="follow" checked> 최근 세션 자동으로 따라가기</label>
    </section>
    <section class="card" data-tab="floors">
      <h2>이 층의 세션 <span class="n" id="ses-n"></span></h2>
      <ul class="sessions" id="sessions"></ul>
    </section>
  </aside>

  <main class="main">
    <section class="card">
      <div class="topbar">
        <span class="title"><span class="no" id="t-floor">—</span><span id="t-project">Agent Office</span></span>
        <span class="sub" id="t-session"></span>
        <span class="pill" id="t-status"><span class="lamp"></span><span>…</span></span>
        <span class="auth" id="auth"></span>
        <div class="controls">
          <button class="btn on" id="b-live" type="button">라이브</button>
          <button class="btn" id="b-replay" type="button">▶ 다시보기</button>
          <select class="btn" id="speed" aria-label="재생 속도"><option value="20">20×</option><option value="60" selected>60×</option><option value="300">300×</option></select>
        </div>
      </div>
      <div class="scrub" id="scrub" hidden><span id="s-time">00:00:00</span><input type="range" id="s-range" min="0" max="0" value="0" aria-label="타임라인"><span id="s-count">0/0</span></div>
      <div class="stage" id="stage">
        <canvas id="iso"></canvas>
        <div class="overlay" id="overlay"></div>
        <div class="zoom"><button class="btn" id="z-in" type="button" aria-label="확대">+</button><button class="btn" id="z-out" type="button" aria-label="축소">−</button><button class="btn" id="z-fit" type="button" aria-label="전체 보기" style="font-size:11px">⟲</button><button class="btn" id="z-me" type="button" aria-label="Claude 위치로" style="font-size:13px">◎</button></div>
      </div>
    </section>
  </main>

  <aside class="rail">
    <section class="card" data-tab="progress">
      <div class="kv"><span class="k">프로젝트</span><span class="v" id="r-project">—</span><span class="k">세션</span><span class="v" id="r-session">—</span><span class="k">마지막</span><span class="v" id="r-last">—</span><span class="k">추출기</span><span class="v" id="r-emitter">—</span></div>
    </section>
    <section class="card" data-tab="progress">
      <h2>진행도 <span class="n" id="p-ratio"></span></h2>
      <div class="sec"><div class="bar"><i id="p-bar" style="width:0%"></i></div></div>
      <div class="kpi">
        <div><div class="v" id="k-commits">0</div><div class="k">commits</div></div>
        <div><div class="v" id="k-files">0</div><div class="k">files</div></div>
        <div><div class="v" id="k-tools">0</div><div class="k">tools</div></div>
        <div><div class="v" id="k-think">0s</div><div class="k">thinking</div></div>
      </div>
    </section>
    <section class="card" data-tab="people">
      <h2>사무실 사람들 <span class="n" id="p-count"></span></h2>
      <div class="sec people" id="people"></div>
    </section>
    <section class="card" data-tab="progress">
      <h2>할 일 목록</h2>
      <div class="sec"><ul class="tasks" id="tasks"></ul></div>
    </section>
    <section class="card" data-tab="progress">
      <h2>git · 손댄 파일</h2>
      <div class="sec files" id="files"></div>
    </section>
    <section class="card" data-tab="log">
      <h2>활동 로그</h2>
      <div class="sec"><ul class="log" id="log"></ul></div>
    </section>
    <section class="card" data-tab="floors">
      <h2>어디서 무엇을 하나</h2>
      <div class="legend" id="legend"></div>
    </section>
  </aside>
</div>

<script>
(() => {
'use strict';
// ================================================================ data access
const BASE = (window.OFFICE_DATA_BASE || 'data').replace(/\/$/, '');
const EMB = window.OFFICE_DATA || null;
const POLL_MS = window.OFFICE_POLL_MS || 10000;
const MODE = EMB ? 'static' : (window.OFFICE_MODE || 'static');       // 'github': floors = data repos the viewer can read
const parseJSONL = t => t.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);

// ---- GitHub mode: the signed-in person's own token (GitHub App, Contents: read) reads the data repos directly.
const GHUB = {api: 'https://api.github.com', token: null, exp: 0, ref: null, user: null, etags: new Map()};
function ghLoad() { try { const v = JSON.parse(localStorage.getItem('office.gh') || 'null'); if (v && v.gh && v.exp > Date.now()) { GHUB.token = v.gh; GHUB.exp = v.exp; GHUB.ref = v.ref || null; } } catch (e) { /* no storage */ } }

async function ghRepos() {        // every data repo this person can read through the app

  for (const i of inst.installations || []) {

      for (const x of r.repositories || []) out.push({repo: x.full_name, pushedAt: x.pushed_at}); if ((r.repositories || []).length < 100) break; page++; }

    if (sum) { floors.push({name: sum.name, description: sum.description, sessions: (sum.sessions || {}).total || 0, active: (sum.sessions || {}).active || 0,

    for (const p of idx.projects || []) floors.push({...p, repo: r.repo, key: `${r.repo}::${p.name}`});
  }

function applyEvent(e, instant) {
  const dwell = instant ? 0 : 1; const now = S.clock();
  if (e.kind === 'session_start') { const c = ensureChar('claude'); ensureChar('user'); if (instant) { c.gx = 10.6; c.gy = 9.5; c.room = 'desk'; } return; }
  if (e.actor === 'user') {
    const u = ensureChar('user');
    setBubble(u, {type: 'say', icon: e.kind === 'interrupt' ? '✋' : '⌨️', text: e.caption || '…', expire: now + (dwell ? 7000 : -1)});
    const cl = S.chars.claude; if (cl) { setBubble(cl, null); cl.lastKind = 'prompt'; cl.lastT = tsOf(e); cl.pose = null; if (e.kind === 'interrupt') { cl.path = []; } }
    if (!dwell) u.bubble = null;
    return;
  }
  const c = ensureChar(e.actor, e.meta); c.lastKind = e.kind; c.lastT = tsOf(e);
  switch (e.kind) {
    case 'spawn': {
      c.gone = false; c.hidden = !instant; c.gx = ELEV.inside[0]; c.gy = ELEV.inside[1]; c.room = 'elevator'; c.book = false;
      const cl = S.chars.claude; if (cl) cl.phoneUntil = now + (dwell ? 2500 : 0);
      if (instant) { c.gx = ELEV.out[0]; c.gy = ELEV.out[1]; }
      else { S.elev.target = 1; S.elev.lit = 2; S.elev.closeAt = now + 2600; setTimeout(() => { c.hidden = false; walkTo(c, ELEV.out[0], ELEV.out[1]); }, 500); }
      setBubble(c, {type: 'say', icon: '🛗', text: `출근! ${e.caption || ''}`, expire: now + (dwell ? 5000 : -1)});
      break; }
    case 'finish': {
      const cl = S.chars.claude; const tx = cl ? cl.gx + 1.0 : 11.6, ty = cl ? cl.gy + 0.1 : 9.6;
      releaseSpot(c); c.book = false; c.room = cl ? cl.room : 'desk';
      const report = () => { setBubble(c, {type: 'say', icon: '📣', text: e.caption || '끝났습니다', expire: now + (dwell ? 7000 : -1)});
        c.leaving = setTimeout(() => leaveOffice(c), dwell ? 7000 : 0); };
      if (instant) { c.gone = true; } else walkTo(c, tx, ty, report);
      break; }
    case 'say': setBubble(c, {type: 'say', text: e.caption || ''}); c.pose = null; break;
    case 'think': setBubble(c, {type: 'think', icon: '💭', text: `${fmtDur(e.dur_ms || 0)} 고민함`, expire: now + (dwell ? 3000 : -1)}); c.pose = 'think'; c.poseUntil = now + (dwell ? 3000 : -1); break;
    case 'tool': {
      if (c.leaving) { clearTimeout(c.leaving); c.leaving = null; }
      const tool = e.tool || '';
      if (tool === 'Agent' || tool === 'Task') { c.phoneUntil = now + (dwell ? 3000 : 0); setBubble(c, {type: 'tool', icon: '📞', text: e.caption || '일 맡기는 중', start: tsOf(e), ref: e.ref}); break; }
      const room = e.room && ROOMS[e.room] && e.room !== 'elevator' ? e.room : 'server';
      c.book = room === 'archive';
      if (c.room !== room || !c.spot) { if (instant) { const s = takeSpot(c, room); c.room = room; c.gx = s.x; c.gy = s.y; c.path = []; } else goRoom(c, room); }
      setBubble(c, {type: 'tool', icon: toolIcon(tool), text: e.caption || tool, start: tsOf(e), ref: e.ref}); c.pose = null;
      break; }
    case 'tool_done': if (c.bubble && c.bubble.ref === e.ref) { c.bubble.end = tsOf(e); c.bubble.expire = now + (dwell ? 2200 : -1); } break;
    case 'tool_err': setBubble(c, {type: 'err', icon: '❌', text: e.caption || '오류', expire: now + (dwell ? 6000 : -1)}); c.sweatUntil = now + (dwell ? 6000 : 0); break;
  }
  if (!dwell && c.bubble && c.bubble.expire) c.bubble = null;
}
function leaveOffice(c) {
  setBubble(c, {type: 'say', icon: '👋', text: '퇴근합니다!'}); releaseSpot(c); c.room = 'elevator';
  walkTo(c, ELEV.out[0], ELEV.out[1], () => { S.elev.target = 1; S.elev.lit = 2; S.elev.closeAt = S.clock() + 2400;
    setTimeout(() => walkTo(c, ELEV.inside[0], ELEV.inside[1], () => { c.gone = true; c.bubble = null; }), 500); });
}
function resetFloor() { for (const c of Object.values(S.chars)) { if (c.leaving) clearTimeout(c.leaving); } S.chars = {}; S.cursor = 0; S.elev = {open: 0, target: 0, lit: 0}; ensureChar('user'); }

// ================================================================ panels
const liveStatus = (p, now = Date.now()) => p.status === 'ended' ? 'ended' : (now - Date.parse(p.lastAt || 0) < 120e3 ? 'active' : 'idle');   // the file's status can be stale: no push while idle
function renderProgress() {
  const p = S.progress; if (!p) return;
  const pr = p.progress || {}; const ratio = pr.ratio == null ? 0 : pr.ratio;
  $('p-ratio').textContent = pr.tasksTotal ? `${pr.tasksDone}/${pr.tasksTotal} · ${Math.round(ratio * 100)}%` : '할 일 없음';
  $('p-bar').style.width = `${Math.round(ratio * 100)}%`;
  $('k-commits').textContent = (p.git && p.git.commits || []).length;
  $('k-files').textContent = (p.git && p.git.filesChanged || []).length;
  $('k-tools').textContent = (p.counters || {}).toolCalls || 0;
  $('k-think').textContent = fmtS((p.counters || {}).think_ms || 0);
  $('tasks').innerHTML = (p.tasks || []).map(t => `<li class="task ${esc(t.status)}"><span class="st">${t.status === 'completed' ? '✓' : ''}</span><span class="tid">#${esc(t.id)}</span><span class="tx">${esc(t.text)}</span></li>`).join('') || '<li class="note">아직 등록된 할 일이 없습니다</li>';
  const files = (p.git && p.git.filesChanged || []).slice(0, 10); const commits = (p.git && p.git.commits || []);
  $('files').innerHTML = (commits.length ? `<span>커밋 ${commits.length}개 · 최근: ${esc(commits[commits.length - 1].msg || '')}</span>` : '<span>이 세션에서 커밋 없음</span>') + files.map(f => `<span>${esc(f)}</span>`).join('');
  const live = liveStatus(p); const st = $('t-status'); st.className = 'pill ' + live; st.innerHTML = `<span class="lamp ${live === 'active' ? 'on' : ''}"></span><span>${({active: 'LIVE', idle: `쉬는 중 · ${fmtRel(p.lastAt)}`, ended: '종료'})[live] || live}</span>`;
  $('r-project').textContent = S.project || '—'; $('r-session').textContent = S.session || '—'; $('r-last').textContent = `${fmtRel(p.lastAt)} · ${(p.versions || []).join(', ')}`;
  const fl = (S.index.projects || []).find(x => (x.key || x.name) === (S.floorKey || S.project)); const em = fl && fl.emitterAt ? Date.parse(fl.emitterAt) : 0;
  $('r-emitter').textContent = em ? (Date.now() - em < 45 * 60e3 ? `살아 있음 · ${fmtRel(fl.emitterAt)}` : `신호 없음 · ${fmtRel(fl.emitterAt)}`) : '—';
}
function renderPeople() {
  const p = S.progress || {}; const upto = S.mode === 'replay' ? S.cursor : S.events.length;
  const last = {}, counts = {}, since = {};
  for (const e of S.events.slice(0, upto)) { if (e.kind === 'tool') counts[e.actor] = (counts[e.actor] || 0) + 1; if (['say', 'tool', 'think', 'spawn', 'finish', 'tool_err', 'tool_done'].includes(e.kind)) last[e.actor] = e; }
  const now = S.clock();
  const row = (actor, name, colorVar, sub, done) => { const e = last[actor]; const c = S.chars[actor];
    let badge = '대기', cls = ''; if (done) badge = '퇴근'; else if (c && c.bubble && c.bubble.type === 'err') { badge = '오류'; cls = 'err'; } else if (c && c.bubble && c.bubble.type === 'think') { badge = '고민 중'; cls = 'think'; } else if (c && c.bubble && c.bubble.type === 'tool' && !c.bubble.end) { badge = '작업 중'; cls = 'work'; }
    const room = c && c.room ? ROOMS[c.room].ko : ''; const what = e ? (e.kind === 'think' ? `💭 ${fmtDur(e.dur_ms || 0)} 고민` : `${e.kind === 'tool' || e.kind === 'tool_done' ? toolIcon(e.tool) + ' ' : ''}${e.caption || e.tool || e.kind}`) : '—';
    return `<div class="person"><div class="av" style="background:var(${colorVar})">${esc((name[0] || '?').toUpperCase())}</div><div style="min-width:0"><div class="l1"><span class="nm">${esc(name)}</span><span class="sub">${esc(sub || '')}</span><span class="badge ${cls}">${badge}</span></div><div class="l2">${room ? `<span style="color:var(--muted)">${esc(room)}</span> · ` : ''}${esc(what)}</div><div class="l3">도구 ${counts[actor] || 0}회${e ? ` · ${fmtS(Math.max(0, now - tsOf(e)))}` : ''}</div></div></div>`; };
  const list = [row('claude', 'Claude', '--c-claude', shortId(S.session))];
  const descOf = id => { const a = (p.agents || []).find(x => x.id === id); return a ? (a.text || '').slice(0, 24) : ''; };
  for (const c of Object.values(S.chars)) { if (!c.actor.startsWith('agent:')) continue; const type = c.type || agentTypeOf(c.actor);
    list.push(row(c.actor, type || '에이전트', ({Explore:'--c-explore',Plan:'--c-plan','general-purpose':'--c-general','claude-code-guide':'--c-guide'})[type] || '--c-other', descOf(c.actor.slice(6)), c.gone)); }
  $('people').innerHTML = list.join(''); $('p-count').textContent = `${list.length}명 근무`;
}
function renderLog() {
  const upto = S.mode === 'replay' ? S.cursor : S.events.length;
  const rows = S.events.slice(0, upto).filter(e => !['tool_done', 'session_start'].includes(e.kind)).slice(-50).reverse();
  $('log').innerHTML = rows.map(e => { const t = e.actor === 'claude' ? ['C', '--c-claude'] : e.actor === 'user' ? ['나', '--c-user'] : [((e.meta || {}).agentType || agentTypeOf(e.actor) || 'A')[0], ({Explore:'--c-explore',Plan:'--c-plan','general-purpose':'--c-general','claude-code-guide':'--c-guide'})[(e.meta || {}).agentType || agentTypeOf(e.actor)] || '--c-other'];
    const text = e.kind === 'think' ? `💭 ${fmtDur(e.dur_ms || 0)} 고민` : e.kind === 'tool' ? `${toolIcon(e.tool)} ${e.room && ROOMS[e.room] ? ROOMS[e.room].ko + ' · ' : ''}${e.caption || e.tool}` : e.kind === 'tool_err' ? `❌ ${e.caption || ''}` : e.kind === 'spawn' ? `🛗 출근 · ${e.caption || ''}` : e.kind === 'finish' ? `👋 퇴근 · ${e.caption || ''}` : e.kind === 'interrupt' ? '✋ 잠깐, 멈춰!' : e.caption || e.kind;
    return `<li><span class="lt">${fmtClock(tsOf(e))}</span><span class="la" style="background:var(${t[1]})">${esc(t[0])}</span><span class="lc ${e.kind === 'say' || e.kind === 'prompt' ? 'say' : ''}">${esc(text)}</span></li>`; }).join('') || '<li class="note">아직 활동이 없습니다</li>';
}
function renderFloors() {
  const projects = (S.index && S.index.projects) || []; const N = projects.length;
  $('floors').innerHTML = projects.map((p, i) => { const no = N - i; const on = p.active > 0 && Date.now() - Date.parse(p.lastAt || 0) < 120e3; const key = p.key || p.name;
    if (p.locked) return `<li class="floor locked" data-no="${no}" title="이 층은 참여자만 볼 수 있습니다"><span class="no">${no}F</span><div style="min-width:0"><div class="nm">🔒 ${esc(p.name)}</div><div class="sb">참여자만 입장</div></div></li>`;
    const warn = (p.alerts || []).some(a => Date.now() - Date.parse(a.t || 0) < 86400e3);
    return `<li class="floor ${key === (S.floorKey || S.project) ? 'sel' : ''}" tabindex="0" data-p="${esc(key)}" data-no="${no}"><span class="no">${no}F</span><div style="min-width:0"><div class="nm">${esc(p.name)}${warn ? ' <span title="최근 24시간 오류" style="color:var(--bad)">●</span>' : ''}</div>${p.description ? `<div class="sb">${esc(p.description)}</div>` : ''}<div class="sb"><span class="lamp ${on ? 'on' : 'off'}"></span>세션 ${p.sessions}개 · ${on ? '지금 활동 중' : fmtRel(p.lastAt)}</div></div></li>`; }).join('') || (MODE === 'github' && !GHUB.token ? '<li class="signin">GitHub로 로그인하면 참여 중인 프로젝트 층이 보입니다<a class="btn" href="auth/login">GitHub로 로그인</a></li>' : '<li class="empty">아직 올라온 프로젝트가 없습니다</li>');
  $('floors').querySelectorAll('.floor:not(.locked)').forEach(el => { const go = () => selectProject(el.dataset.p, +el.dataset.no, true); el.onclick = go; el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } }; });
}
function renderSessions() {
  const list = (S.projectInfo && S.projectInfo.sessions) || [];
  $('ses-n').textContent = list.length ? `${list.length}개` : '';
  $('sessions').innerHTML = list.map(s => `<li class="ses ${s.session === S.session ? 'sel' : ''}" tabindex="0" data-s="${esc(s.session)}"><span class="t">${esc(s.title || s.last || '제목 없는 세션')}<small>${shortId(s.session)}</small></span><span class="w">${liveStatus(s) === 'active' ? '<span class="pill active"><span class="lamp on"></span>지금 활동 중</span>' : fmtRel(s.lastAt)}</span></li>`).join('') || '<li class="empty">세션 없음</li>';
  $('sessions').querySelectorAll('.ses').forEach(el => { const go = () => selectSession(el.dataset.s); el.onclick = go; el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } }; });
}
function renderLegend() { $('legend').innerHTML = LEGEND.map(([k, t]) => `<span><i style="background:${floorFill(ROOMS[k].floor)}"></i><b>${ROOMS[k].ko}</b> ${t}</span>`).join(''); }

// ================================================================ loading & modes
async function boot() {
  PAL = isDark() ? PALETTE.dark : PALETTE.light; renderLegend();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { PAL = isDark() ? PALETTE.dark : PALETTE.light; S.static = buildStatic(); renderLegend(); });
  new MutationObserver(() => { PAL = isDark() ? PALETTE.dark : PALETTE.light; S.static = buildStatic(); renderLegend(); }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
  resize(); fitCamera(); S.static = buildStatic(); ensureChar('user');
  if (MODE === 'github') { ghLoad(); ghFromHash(); }
  renderAuth();
  await loadIndex();
  renderFloors();
  const projects = (S.index.projects || []).filter(p => !p.locked); const i = Math.max(0, projects.findIndex(p => p.active));
  if (projects.length) await selectProject(projects[i].key || projects[i].name, (S.index.projects || []).length - (S.index.projects || []).indexOf(projects[i]), false); else { $('t-project').textContent = 'Agent Office'; $('t-status').hidden = true; }
  setInterval(() => { if (S.mode === 'live') followLatest(); }, 30000);
  let last = performance.now();
  (function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; tickChars(dt); render(); syncOverlay(); requestAnimationFrame(loop); })(last);
  setInterval(() => { if (S.mode === 'live') { renderPeople(); if (S.progress) renderProgress(); } }, 1000);
}
async function loadIndex() {
  if (MODE === 'github') { if (!GHUB.token) { S.index = {projects: []}; return; } try { S.index = {projects: await ghFloors()}; } catch (e) { S.index = {projects: []}; } return; }
  try { S.index = await getJSON('index.json'); } catch (e) { S.index = {projects: []}; }
}
function renderAuth() {
  const a = $('auth'); if (MODE !== 'github') { a.hidden = true; return; }
  if (!GHUB.token) { a.innerHTML = '<a class="btn" href="auth/login">GitHub로 로그인</a>'; return; }
  a.innerHTML = `${GHUB.user ? `<img src="${esc(GHUB.user.avatar_url)}" alt=""><span>${esc(GHUB.user.login)}</span>` : '<span>로그인됨</span>'}<button class="btn" type="button" id="b-logout">로그아웃</button>`;
  $('b-logout').onclick = () => { ghLogout(); S.index = {projects: []}; S.events = []; S.progress = null; resetFloor(); renderAuth(); renderFloors(); renderSessions(); renderPeople(); renderLog(); $('t-project').textContent = 'Agent Office'; };
  if (!GHUB.user) ghFetch('/user').then(u => { GHUB.user = u; renderAuth(); }).catch(() => {});
}
async function followLatest() {
  await loadIndex();
  renderFloors();
  if (!$('follow').checked) return;
  const projects = (S.index.projects || []).filter(p => !p.locked); const active = projects.find(p => p.active);
  if (active && (active.key || active.name) !== (S.floorKey || S.project)) { await selectProject(active.key || active.name, (S.index.projects || []).length - (S.index.projects || []).indexOf(active), true); return; }
  try { S.projectInfo = await getJSON('project.json'); } catch (e) { return; }
  renderSessions();
  const newest = (S.projectInfo.sessions || [])[0];
  if (newest && newest.session !== S.session && (liveStatus(newest) === 'active' || !(S.progress && liveStatus(S.progress) === 'active'))) await selectSession(newest.session);
}
async function selectProject(key, no, showIndicator) {
  const floor = (S.index.projects || []).find(p => (p.key || p.name) === key) || {name: key};
  S.project = floor.name; S.repo = floor.repo || null; S.floorKey = key; S.floorNo = no; renderFloors(); $('t-floor').textContent = `${no}F`;
  if (showIndicator && ov.ind) { ov.ind.textContent = `▲ ${no}F`; ov.ind.classList.add('show'); S.elev.lit = 2.5; clearTimeout(ov.indT); ov.indT = setTimeout(() => ov.ind.classList.remove('show'), 2500); }
  try { S.projectInfo = await getJSON('project.json'); } catch (e) { S.projectInfo = {sessions: []}; }
  renderSessions();
  const s = S.projectInfo.sessions[0]; if (s) await selectSession(s.session); else { S.events = []; S.progress = null; resetFloor(); renderProgress(); renderPeople(); renderLog(); }
}
async function selectSession(ses) {
  S.session = ses; renderSessions(); stopReplay(); S.mode = 'live'; $('b-live').classList.add('on'); $('b-replay').classList.remove('on'); $('scrub').hidden = true;
  $('t-project').textContent = S.project; $('t-session').textContent = shortId(ses);
  await refresh(true);
  clearInterval(S.pollTimer); S.pollTimer = setInterval(() => { if (S.mode === 'live') refresh(false); }, POLL_MS);
}
async function refresh(full) {
  let progress = null, events = null;
  try { progress = await getJSON(`sessions/${S.session}.progress.json`); } catch (e) { /* keep */ }
  try { events = await getEvents(`sessions/${S.session}.events.jsonl`); } catch (e) { events = S.events; }
  if (progress) S.progress = progress;
  const known = S.events.length; S.events = events || [];
  if (full || known === 0 || S.events.length < known) { resetFloor(); for (const e of S.events) applyEvent(e, true); S.cursor = S.events.length; }
  else { const fresh = S.events.slice(known); fresh.forEach((e, i) => setTimeout(() => applyEvent(e, false), i * 400)); S.cursor = S.events.length; }
  S.static = buildStatic(); renderProgress(); renderPeople(); renderLog();
  const cl = S.chars.claude; const lastE = S.events[S.events.length - 1];
  if (cl && lastE && !['tool', 'say'].includes(lastE.kind)) { cl.lastKind = lastE.kind === 'prompt' ? 'prompt' : 'tool_done'; cl.lastT = tsOf(lastE); }
}
function startReplay() {
  if (!S.events.length) return;
  stopReplay(); S.mode = 'replay'; $('b-live').classList.remove('on'); $('b-replay').classList.add('on'); $('scrub').hidden = false;
  resetFloor(); const r = S.replay; r.speed = +$('speed').value; r.vt = tsOf(S.events[0]); r.last = performance.now(); r.jumpFor = -1; S.clock = () => r.vt;
  $('s-range').max = S.events.length; $('s-range').value = 0; renderPeople(); renderLog();
  r.timer = setInterval(stepReplay, 100);
}
function stepReplay() {
  const r = S.replay; const now = performance.now(); const dt = (now - r.last) * r.speed; r.last = now;
  const next = S.events[S.cursor]; if (!next) { stopReplay(true); return; }
  const target = tsOf(next);
  if (r.jumpFor !== S.cursor) { r.jumpFor = S.cursor; r.jump = (target - r.vt) / 20; }   // a quiet gap costs at most ~2s of real time
  const gap = target - r.vt; const adv = Math.max(dt, r.jump);
  r.vt = gap <= adv ? target : r.vt + adv;
  $('s-time').textContent = fmtClock(r.vt);
  if (r.vt < target) return;
  let n = 0; while (S.cursor < S.events.length && tsOf(S.events[S.cursor]) <= r.vt && n < 6) { applyEvent(S.events[S.cursor], false); S.cursor++; n++; }
  $('s-range').value = S.cursor; $('s-count').textContent = `${S.cursor}/${S.events.length}`; renderPeople(); renderLog();
}
function stopReplay(finished) { const r = S.replay; clearInterval(r.timer); r.timer = null; S.clock = () => Date.now();
  if (finished) { $('b-replay').classList.remove('on'); $('s-count').textContent = `${S.events.length}/${S.events.length} · 끝`; } }
function seekReplay(n) { const r = S.replay; resetFloor(); S.cursor = 0; for (let i = 0; i < n; i++) { applyEvent(S.events[i], true); S.cursor++; }
  r.vt = n ? tsOf(S.events[n - 1]) : tsOf(S.events[0]); r.last = performance.now(); r.jumpFor = -1; $('s-count').textContent = `${S.cursor}/${S.events.length}`; $('s-time').textContent = fmtClock(r.vt); renderPeople(); renderLog(); }
$('b-live').onclick = () => { if (S.mode === 'live') return; stopReplay(); S.mode = 'live'; $('b-live').classList.add('on'); $('b-replay').classList.remove('on'); $('scrub').hidden = true; refresh(true); };
$('b-replay').onclick = () => startReplay();
$('speed').onchange = () => { if (S.mode === 'replay') S.replay.speed = +$('speed').value; };
$('s-range').oninput = ev => { if (S.mode === 'replay') seekReplay(+ev.target.value); };

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { $('app').dataset.tab = b.dataset.t; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); });
boot();
})();
