[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-extract"
version = "0.1.0"
description = "Claude Code transcript -> Agent Office events + progress snapshots (stdlib only)"
requires-python = ">=3.10"

[project.scripts]
office-extract = "office_extract.cli:main"
office-emit = "office_extract.emit:main"
office-plan = "office_extract.plan:main"
office-probe = "office_extract.probe:main"

[tool.setuptools.packages.find]
where = ["."]
