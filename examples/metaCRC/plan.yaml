# metaCRC — Agent Office plan  (source: metaCRC_runbook.sh, 2026-10-22, Block 1)
# Everything below is taken from the runbook; nothing is invented. Block 2+ stages get added when
# their runbook exists. Edit freely; `office-plan check plan.yaml` validates and writes plan.json.

project: metaCRC
description: "대장암 메타지놈 코호트 — K-BDS Block 1 (prefetch → dump → qc → merge → assemble → bin → mag_qc)"
repo: aababc1/office-metacrc            # data repo of this floor (participants = collaborators)
members: [aababc1]
dates:
  start: 2026-10-22
  due: null                             # TODO
where: kbds                             # default site for stages that do not say `where:`

# All data stages run on K-BDS (prefetch included — 02_prefetch_kbds.sh in tmux on the login node, as in the runbook).
# The lab Linux server is where metaFun itself is developed; that work shows up through Claude sessions
# (office-extract) and their git commits, not through this plan. `office-probe --site kbds` reports the stages below.
sites:
  local:
    name: lab Linux server              # metaFun development only — no data stages here
  kbds:
    name: K-BDS (KISTI)
    login: bdata-login01                # login-only node: the probe is I/O-light (stat + read logs) and runs here
    slurm_user: k260a01
    partitions: [cpu64-only, cpu64-only-m512GB, cpu32-only]   # the ones this project submits to (sinfo is read for these)
    paths:
      PROJ: /scratch/$USER/metaCRC
pipeline:
  kind: nextflow                        # metaFun on the Slurm executor
  trace: $PROJ/run/trace.txt            # nextflow run ... -with-trace $PROJ/run/trace.txt   (one line per finished task)
  log: $PROJ/run/.nextflow.log          # run start/end, "Submitted process", "Cached process", errors
  work: $PROJ/work                      # task dirs: .command.begin = started, .exitcode = finished (shows in-flight tasks)
  # Stage ↔ Nextflow process mapping goes in each stage's `done: {kind: nextflow, process: [...]}` once the
  # process names are known from a real trace. Until then, processes seen in the trace are reported as-is.

# Same variables as 00_env.sh. $USER comes from the environment on the probe host.
paths:
  PROJ: /scratch/$USER/metaCRC
  MANIFEST: $PROJ/manifest/run_manifest.tsv
  RUNLIST: $PROJ/manifest/runs_all.txt
  MULTI: $PROJ/manifest/samples_multirun.txt
  ASMLIST: $PROJ/manifest/samples_assemble.txt
  SRA_DIR: $PROJ/sra
  FQ_DIR: $PROJ/fastq
  QC_DIR: $PROJ/qc
  MRG_DIR: $PROJ/merged
  ASM_DIR: $PROJ/assembly
  BIN_DIR: $PROJ/bins
  MAG_DIR: $PROJ/mag_qc
  LOG_DIR: $PROJ/logs

# Facts from the manifest (2026-10-22): 10,481 runs / 9,656 samples / 27 cohorts;
# PAIRED 8,420 · SINGLE 2,061; multirun PAIRED samples 322 (PRJEB6070 196 · PRJEB12449 110 · PRJEB27928 16);
# 79 runs > 20 GB (.sra). Decide: SINGLE runs (2,061) will fail 03_dump under the paired-only policy
# unless removed from runs_all.txt.
units:
  run:
    file: $RUNLIST                      # one id per line (10,481)
  sample_multirun:
    file: $MULTI                        # 322
  sample_assemble:
    file: $ASMLIST                      # not created yet → stage shows "not planned" until it exists

stages:
  - name: prefetch
    desc: "prefetch + vdb-validate (02_prefetch_kbds.sh, tmux on the login node, 6 parallel)"
    unit: run
    units: {file: $RUNLIST}
    done: {kind: file, path: "$SRA_DIR/{run}/.validated"}
    failed: {log: "$LOG_DIR/prefetch.FAILED"}           # lines: "<run> PREFETCH_FAIL|VDB_INVALID"
    implied_by: dump                                      # 03_dump deletes $SRA_DIR/<run> after a successful dump
    runner: {kind: shell, parallel: 6}

  - name: dump
    desc: "fasterq-dump → fastq.gz (03_dump.sbatch)"
    unit: run
    units: {file: $RUNLIST}
    after: [prefetch]
    done: {kind: file, path: "$FQ_DIR/{run}_1.fastq.gz"}
    failed: {log: "$LOG_DIR/dump.FAILED"}                # NOT_VALIDATED | NO_SRA | DUMP_FAIL
    runner: {kind: slurm, job: metacrc-dump, array: 1000, cpus: 8, mem: 24G, time_h: 12}

  - name: qc
    desc: "fastp + host removal (04_qc.sbatch)"
    unit: run
    units: {file: $RUNLIST}
    after: [dump]
    done: {kind: file, path: "$QC_DIR/{run}_1.fastq.gz"}
    failed: {log: "$LOG_DIR/qc.FAILED"}                  # NO_FASTQ | FASTP_FAIL
    runner: {kind: slurm, job: metacrc-qc, array: 1000, cpus: 8, mem: 32G, time_h: 8}

  - name: merge
    desc: "multi-run samples → one R1/R2 (05_merge.sbatch)"
    unit: sample
    units: {file: $MULTI}
    after: [qc]
    done: {kind: file, path: "$MRG_DIR/{sample}_R1.fastq.gz"}
    failed: {log: "$LOG_DIR/merge.FAILED"}               # MISSING_<run> | PAIR_MISMATCH
    runner: {kind: slurm, job: metacrc-merge, array: 322, cpus: 4, mem: 8G, time_h: 4}

  - name: assemble
    desc: "MEGAHIT de novo assembly (06_assemble.sbatch, himem)"
    unit: sample
    units: {file: $ASMLIST}
    after: [qc, merge]
    done: {kind: file, path: "$ASM_DIR/{sample}/contigs.renamed.fa"}
    failed: {log: "$LOG_DIR/asm.FAILED"}                 # NO_INPUT | MEGAHIT_FAIL
    runner: {kind: slurm, job: metacrc-asm, array: 200, cpus: 32, mem: 250G, time_h: 48}

  - name: bin
    desc: "MetaBAT2 + SemiBin2 + DAS Tool (07_bin.sbatch)"
    unit: sample
    units: {file: $ASMLIST}
    after: [assemble]
    done: {kind: dir, path: "$BIN_DIR/{sample}/dastool_DASTool_bins"}
    failed: {log: "$LOG_DIR/bin.FAILED"}                 # DASTOOL_FAIL
    runner: {kind: slurm, job: metacrc-bin, array: 100, cpus: 16, mem: 120G, time_h: 24}

  - name: mag_qc
    desc: "CheckM2 + GUNC + GTDB-Tk r232, all MAGs in one batch (08_mag_qc.sbatch)"
    unit: once
    after: [bin]
    done: {kind: file, path: "$MAG_DIR/mag_quality.tsv"}
    runner: {kind: slurm, job: metacrc-magqc, cpus: 64, mem: 400G, time_h: 72}

milestones: []                           # TODO: {date: 2026-MM-DD, name: ...}

alerts: [job_failed, stage_done, heartbeat_lost_2h]
